spring.application.name=backend.v1
# ==============================
# Database — switch by changing this one line and restarting.
# The actual connection settings live in application-h2.properties
# and application-mysql.properties.
# ==============================
spring.profiles.active=mysql

# Create an API key for OpenAI and set it here
#  Google Gemini
spring.ai.google.genai.api-key=#######################
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.3
# ????? ???? ?????? ???? ????? ??????
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ==============================
# Spring AI Retry Configuration (Rate Limit Mitigation)
# ==============================
spring.ai.retry.max-attempts=3
spring.ai.retry.back-off.initial-interval=2000
spring.ai.retry.back-off.multiplier=2
# ==============================
# Multi-Provider LLM Configuration
# ==============================

nglp.llm.providers[0].key=gemini
nglp.llm.providers[0].default-model=gemini-2.5-flash
nglp.llm.providers[0].enabled=true
nglp.llm.providers[0].models[0].key=gemini-2.5-flash
nglp.llm.providers[0].models[0].name=Gemini 2.5 Flash
nglp.llm.providers[0].models[0].is-free=true
nglp.llm.providers[0].models[1].key=gemini-2.5-pro
nglp.llm.providers[0].models[1].name=Gemini 2.5 Pro
nglp.llm.providers[0].models[1].is-free=false

nglp.llm.providers[1].key=deepseek
nglp.llm.providers[1].default-model=deepseek-chat
nglp.llm.providers[1].enabled=true
nglp.llm.providers[1].models[0].key=deepseek-chat
nglp.llm.providers[1].models[0].name=DeepSeek Chat
nglp.llm.providers[1].models[0].is-free=true

nglp.llm.providers[2].key=groq
nglp.llm.providers[2].default-model=llama-3.3-70b-versatile
nglp.llm.providers[2].enabled=true
nglp.llm.providers[2].models[0].key=llama-3.3-70b-versatile
nglp.llm.providers[2].models[0].name=Llama 3.3 70B
nglp.llm.providers[2].models[0].is-free=true
nglp.llm.providers[2].models[1].key=mixtral-8x7b-32768
nglp.llm.providers[2].models[1].name=Mixtral 8x7B
nglp.llm.providers[2].models[1].is-free=true

nglp.llm.groq.api-key=#############3
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
nglp.llm.deepseek.api-key=###############